      # 以下都是手写层:填了就覆盖数据里的同名字段,留空则用数据里的值。
      - name: description
        label: 描述
        widget: string
        required: false
        preview: false
        hint: '物品页简介;留空就用游戏数据里的。'
      - name: flavor
        label: 风味文字
        widget: string
        required: false
        preview: false
        hint: '风味文字;留空就用游戏数据里的。'
      - name: notes
        label: 备注
        widget: string
        required: false
        preview: false
        hint: '显示在物品页的提示框里;留空就不显示。'
      - name: usage
        label: 用法
        widget: list
        required: false
        preview: false
        hint: '每一条一行;留空就用游戏数据里的。'
        fields:
          - name: type
            label: 类型
            widget: string
            required: false
          - name: text
            label: 文字
            widget: string
            required: false
          - name: source
            label: 来源
            widget: string
            required: false
      - name: sources
        label: 来源
        widget: list
        required: false
        preview: false
        hint: '每一条一行;留空就用游戏数据里的。'
        fields:
          - name: source
            label: 来源
            widget: string
            required: false
          - name: detail
            label: 说明
            widget: string
            required: false
          - name: probability
            label: 概率
            widget: string
            required: false
      - name: related
        label: 相关物品
        widget: list
        required: false
        preview: false
        hint: '每行一个物品 ID;留空就用游戏数据里的。'
      - name: categories
        label: 分类
        widget: list
        required: false
        preview: false
        hint: '每行一个分类;留空就用游戏数据里的。'
      - name: price
        label: 价格
        widget: number
        required: false
        preview: false
        hint: '留空就用游戏数据里的价格。'
      - name: icon
        label: 图标路径
        widget: string
        required: false
        preview: false
        hint: '一般不用填:留空就用游戏里的贴图。'
      - name: shape
        label: 占格尺寸
        widget: list
        required: false
        preview: false
        hint: '宽、高两个数字,每行一个;留空就用游戏数据里的。'
      # 正文要放在字段的最后一个
      - name: body
        label: 详解正文
        widget: markdown
        # 物品的正文是补充:现有 65 篇详解的正文都是空的,新建一篇也可以先不写。
        required: false
        # 打开时是所见即所得的富文本编辑器;第一项是打开时的模式。
        modes:
