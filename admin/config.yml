# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# 在线编辑器(Sveltia CMS)的配置。入口是 /admin/;本文件和 index.html 放在同一目录,
# 构建时会一起复制到 dist/admin/,改完要重新构建才会生效。
#
# label 是贡献者在编辑器里看到的字段名,hint 是字段下方的说明,都请用中文写。
# 以 # 开头的整行是注释,不影响配置。

backend:
  name: github
  # 仓库所在的 GitHub 组织。改名或搬家时,下面 site_url 与 tests/admin-config.test.js 要一起改。
  repo: probably-documented/probably-stolen-mod-wiki
  branch: main
  auth_type: additions
  # 登录服务(Sveltia CMS Additions,部署在 Cloudflare Workers 上的一个 Worker)的地址。
  # 换了服务或换了地址就改这里;末尾不带斜杠。
  base_url: https://sveltia-cms-additions.xiaoxuannocare.workers.dev

site_url: https://probably-documented.github.io/probably-stolen-mod-wiki/

# 顶层的 media_folder 只是让 CMS 配置通过校验的占位:Sveltia CMS 0.271.0 在没有配置任何云端媒体库时
# 要求必须有它。页面的图片不放在这里(构建也不读取这个目录),而是放在每个页面自己旁边的 images/
# 文件夹里,见下面各个 collection 的 media_folder。
media_folder: assets/uploads

# 上传文件的通用规则。
media_libraries:
  all:
    # 文件名转成 URL 友好的形式(空格等会被处理掉)。
    slugify_filename: true
    # 保留原文件名,再加一段唯一的后缀:两个页面各自上传的图片不会重名、不会互相覆盖。
    filename_template: '{{filename}}-{{uuid_short}}'
    # 单个文件最大 5 MB。
    max_file_size: 5242880

collections:
  # 物品的「详解」:每个文件对应一件物品,文件名就是物品 ID(只能从下拉列表里选)。
  # content/items/*.md 的 frontmatter 里,除 slug 以外的键(现有 fixture 里的 title、
  # fixture-fm-key、related)渲染器不读,所以不声明成字段;CMS 保存时会原样保留它们。
  - name: items
    label: 物品详解
    description: 每个文件是一篇物品详解,显示在对应物品详情页的「详解」一节。一篇详解对应一件物品,由「物品」一栏决定。
    folder: content/items
    create: true
    delete: true
    # 文件名就是「物品」一栏选中的物品 ID
    slug: '{{fields.slug}}'
    # 列表里显示的标题就是文件名(物品 ID)
    summary: '{{slug}}'
    # 插入的图片存放在 content/items/images/,正文里按相对路径引用(images/文件名);构建会把它们
    # 发布到物品页旁边。只支持位图(png、jpg、gif、webp 等),不支持 SVG。
    media_folder: images
    public_folder: images
    fields:
      - name: slug
        label: 物品
        widget: select
        hint: '只能从列表里选。这个值就是页面的文件名:选了哪件物品,这篇详解就显示在那件物品的页面上。'
        options:
          - label: 神奇乳汁
            value: wondrous_milk
          - label: 触手本体
            value: tentacle_body
          - label: 神奇乳汁桶
            value: milk_barrel
          - label: 浓郁乳汁
            value: milk_rich
          - label: 触手卵
            value: brood_egg
          - label: 掌上青楼
            value: palm_brothel
          - label: tear_merchant
            value: tear_merchant
      # 正文要放在字段的最后一个
      - name: body
        label: 详解正文
        widget: markdown
        # 只开放原文(Markdown)编辑:富文本模式会把 Markdown 重新排版,会不会改写
        # [[物品ID]] 和 html 直通块还没有实测(Task 10),在此之前不开放所见即所得
        modes:
          - raw
        hint: '显示在物品详情页的「详解」一节。正文支持 Markdown,可以贴外部链接(会在新标签页打开),也可以插入图片:上传的图片保存在页面旁边的 images 文件夹,自动转成 URL 友好的文件名。只支持 png、jpg、gif、webp 等位图图片,不支持 SVG。'

  # 机制说明:每个文件是一个页面,会出现在站点的「机制说明」索引里。
  - name: mechanics
    label: 机制说明
    description: 每个文件是一个机制说明页面,会出现在站点的「机制说明」索引里。
    folder: content/mechanics
    create: true
    delete: true
    # 插入的图片存放在 content/mechanics/images/,正文里按相对路径引用(images/文件名);构建会把
    # 它们发布到机制页旁边。只支持位图(png、jpg、gif、webp 等),不支持 SVG。
    media_folder: images
    public_folder: images
    fields:
      - name: title
        label: 标题
        widget: string
        hint: '页面的标题,会显示在「机制说明」索引里。文件名由它自动生成。'
      - name: nav_label
        label: 顶部导航上的名字
        widget: string
        required: false
        hint: '留空。全站最多一页填写;填写的页面会出现在顶部导航——目前是「关于本站」那一页。'
      # 正文要放在字段的最后一个
      - name: body
        label: 正文
        widget: markdown
        # 只开放原文(Markdown)编辑:富文本模式会把 Markdown 重新排版,会不会改写
        # [[物品ID]] 和 html 直通块还没有实测(Task 10),在此之前不开放所见即所得
        modes:
          - raw
        hint: '正文支持 Markdown,可以贴外部链接(会在新标签页打开),也可以插入图片:上传的图片保存在页面旁边的 images 文件夹,自动转成 URL 友好的文件名。只支持 png、jpg、gif、webp 等位图图片,不支持 SVG。'
