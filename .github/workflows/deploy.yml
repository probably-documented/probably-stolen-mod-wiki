# 在线站部署:main 的每次推送 → 测试 → 构建站点 → 部署到 GitHub Pages。
# 离线包不在这里打包:它由 release-offline.yml 发布到 GitHub Releases(两个包之间至少隔 3 天,有更新才发)。
# 本仓库零 npm 依赖,所以没有 npm install。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个部署;不中断进行中的生产部署,跳过其间排队的运行。
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # 读取 Pages 站点配置;若仓库尚未把 Pages 来源设为 GitHub Actions,这里会明确报错。
      - name: Read the Pages site configuration
        uses: actions/configure-pages@v6

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
